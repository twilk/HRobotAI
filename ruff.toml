# Shared ruff configuration for the two Python services (agent-service, grafik-optimizer).
# One file at the repo root instead of per-service config: ruff walks up from each file, both
# services resolve here, and local runs match CI exactly (`ruff check agent-service grafik-optimizer`).
#
# Scope decision [CI-6]: LINT ONLY. `ruff format` is deliberately NOT a CI gate — enabling it today
# would reformat 34 of 52 files, which buries the real signal in whitespace churn. Formatting can be
# adopted later as its own commit; the lint gate is what catches dead imports/variables and real bugs.

# python:3.12-slim is the base image for both services (see their Dockerfiles) and the version the
# CI lanes pin, so lint against the same target.
target-version = "py312"

# Ruff's default line-length. Note E501 is NOT in the default rule set, so this only affects
# formatting-adjacent rules, not the lint gate.
line-length = 100

# Generated/vendored trees that are not ours to lint.
extend-exclude = ["**/__pycache__", "**/.venv", "**/data", "**/artifacts"]

[lint]
# Ruff defaults: E4 (imports), E7 (statements), E9 (runtime/syntax errors), F (pyflakes — unused
# imports/variables, undefined names, f-string bugs). This is the "catches real mistakes, argues
# about no style" set. Widen deliberately, not by accident.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Test modules legitimately import fixtures/symbols for their side effects and re-export contract
# types that assertions reference indirectly.
"**/tests/**" = ["E402"]
