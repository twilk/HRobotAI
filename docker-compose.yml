# HRobot dev stack — two services (control-plane :3000, tenant-runtime :3001).
#
#   docker compose up -d                  # backing services only (postgres, redis, rabbitmq, keycloak)
#   docker compose --profile full up -d --build   # + both app containers
#   docker compose ps                     # check health
#   docker compose down                   # stop (add -v to wipe data)
#
# For day-to-day dev, run the apps on the host
# (`pnpm --filter @hrobot/control-plane dev`, `PORT=3001 pnpm --filter @hrobot/tenant-runtime dev`)
# against `docker compose up -d`. The containerized `control-plane` / `tenant-runtime`
# services (profile "full") are for CI / prod-parity and are NOT started by a bare
# `up -d`, so they never collide with host apps on :3000 / :3001.

services:
  postgres:
    image: postgres:16-alpine
    # POSTGRES_DB creates hrobot_control on first boot; the `postgres`
    # maintenance DB (used by POSTGRES_SUPERUSER_URL) always exists too.
    #
    # Credentials come from .env (see .env.example). The `:-` fallbacks keep a bare
    # `docker compose up -d` working on a fresh clone; STAGING MUST override them. [ENV-2]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hrobot_control}
    ports:
      - "5432:5432"
    volumes:
      - hrobot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # Dev default guest/guest; management UI at http://localhost:15672. Override on staging. [ENV-2]
    # NOTE: rabbitmq only applies RABBITMQ_DEFAULT_* on a FIRST boot with an empty data dir.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      # KC 25+ renamed KEYCLOAK_ADMIN* -> KC_BOOTSTRAP_ADMIN*.
      # Dev default admin/admin; STAGING MUST override via .env. [ENV-2]
      # NOTE: the bootstrap admin is only created on a FIRST boot against an empty
      # hrobot_keycloak volume — changing this later requires resetting the password in the KC
      # admin console (or `docker compose down -v`), not just editing .env.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    # Persist KC's embedded H2 so realms/clients/users survive `docker compose down` (without -v).
    volumes:
      - hrobot_keycloak:/opt/keycloak/data

  # Control-plane API as a container (CI/prod parity). For day-to-day dev, run it
  # on the host. Gated behind the "full" profile so a bare `docker compose up -d`
  # starts only backing services (no :3000 collision with a host app).
  control-plane:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    # Secrets come from .env (cp .env.example .env first); required:false so the
    # other services still start if .env is absent. Connection URLs are
    # overridden here to use compose service DNS names instead of localhost.
    env_file:
      - path: .env
        required: false
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hrobot_control}
      POSTGRES_SUPERUSER_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      KEYCLOAK_URL: http://keycloak:8080
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Tenant-runtime API as a container (CI/prod parity). Same monorepo build, runs
  # the apps/tenant-runtime dist. Listens on 3001 to avoid the control-plane port.
  tenant-runtime:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/tenant-runtime/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hrobot_control}
      POSTGRES_SUPERUSER_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      KEYCLOAK_URL: http://keycloak:8080
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3001:3001"

  # Grafik solver (FastAPI + CP-SAT). M2-A1 skeleton: GET /health + a STUB POST /solve carrying the
  # frozen ProblemInput/SolveResult contract; the CP-SAT model lands in M2-A2. Built from the
  # separate ./grafik-optimizer Python image (not the monorepo Node build). Gated behind "full"
  # like the other app services so a bare `docker compose up -d` starts only backing services.
  optimizer:
    profiles: ["full"]
    build:
      context: ./grafik-optimizer
      dockerfile: Dockerfile
    environment:
      # Unbuffered stdout so uvicorn/solver logs stream promptly under Docker.
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"

  # RESERVED SLOT — RL agent (roadmap #2, spec #1 §3/§41). The agent shares the optimizer image and
  # container build (same ./grafik-optimizer context); its training/serving entrypoint and behavior
  # are implemented in a later task, NOT here. Gated behind its own "agent" profile so it never
  # starts via `up -d` or `--profile full`; enable explicitly with `--profile agent` once built.
  agent:
    profiles: ["agent"]
    build:
      context: ./grafik-optimizer
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    # command:  # set by the RL-agent task (shares the optimizer image; runs the agent loop, not uvicorn)

  # Local speech-to-text for the Agent Głosowy module (M3). faster-whisper `small` (PL) on CPU, in
  # its own image — CTranslate2, not torch/SB3, so it must not be mixed into the heavy RL image
  # (see docs/superpowers/specs/2026-07-21-agent-glosowy-poc.md §1/§3).
  #
  # RODO: a voice recording is personal data, so transcription runs HERE and audio never leaves EU
  # infrastructure. That is why the browser records with MediaRecorder and posts to this service
  # rather than using Chrome's Web Speech API, which uploads audio to the vendor.
  #
  # Behind "full" like the other app services. The ~490 MB model is downloaded on FIRST use and
  # cached in the named volume, so a restart does not re-download it; after that it runs offline.
  stt:
    profiles: ["full"]
    build:
      context: ./stt-service
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      # Doubles as the default trusted-issuer base: /voice/* refuses to fetch JWKS from any address
      # that is not <trusted base>/realms/<realm>, so a forged token cannot point key resolution at
      # a host the attacker owns. [track J — see .env.example KEYCLOAK_TRUSTED_ISSUERS]
      #
      # This value is correct for the demo: the seeded `hrobot-staging` realm pins
      # frontendUrl=http://keycloak:8080, so its tokens carry exactly this base even though the
      # browser reaches Keycloak on :8081. A realm WITHOUT a frontendUrl issues the host the caller
      # used, so a deployment mixing both needs the comma-separated list below instead.
      KEYCLOAK_URL: "http://keycloak:8080"
      # KEYCLOAK_TRUSTED_ISSUERS: "http://keycloak:8080,https://auth.example.com"
      STT_MODEL_SIZE: "small"
      STT_COMPUTE_TYPE: "int8"
      STT_LANGUAGE: "pl"
      HF_HOME: "/models"
    volumes:
      - hrobot_stt_models:/models
    ports:
      - "8010:8010"

volumes:
  hrobot_pgdata:
  hrobot_keycloak:
  hrobot_stt_models:
